services:
  traceforge:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: traceforge-app
    env_file:
      - ../.env
    volumes:
      - traceforge-app-data:/data
      - ../workspace:/app/workspace
      - ../workspace-gitea-audit:/app/workspace-gitea-audit
      - ../workspace_shared:/app/workspace_shared
      - ../agents.yaml:/app/agents.yaml:ro
    environment:
      TRACEFORGE_DB_PATH: /data/traceforge.sqlite3
      TRACEFORGE_MEMORY_EMBEDDING_PROVIDER: local
      TRACEFORGE_MEMORY_EMBEDDING_CACHE_DIR: /data/models/embeddings
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
      TRACEFORGE_ZULIP_API_CONNECT_URL: https://172.18.0.1:18443
      TRACEFORGE_AGENTS_CONFIG: /app/agents.yaml
      TRACEFORGE_GITEA_URL: http://127.0.0.1:13000
      TRACEFORGE_GITEA_API_CONNECT_URL: http://172.18.0.1:13000
      TRACEFORGE_MCP_TAVILY_COMMAND: node
      TRACEFORGE_MCP_TAVILY_ARGS: /usr/lib/node_modules/tavily-mcp/build/index.js
    ports:
      - "${TRACEFORGE_PORT:-19090}:8090"
    restart: unless-stopped
    depends_on:
      - traceforge-postgres
      - traceforge-redis

  traceforge-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: traceforge-postgres
    environment:
      POSTGRES_DB: traceforge
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge_dev_password
    ports:
      - "${TRACEFORGE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - traceforge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  traceforge-redis:
    image: docker.io/library/redis:7-alpine
    container_name: traceforge-redis
    ports:
      - "${TRACEFORGE_REDIS_PORT:-16380}:6379"
    restart: unless-stopped

volumes:
  traceforge-app-data:
  traceforge-postgres-data:
