secrets:
  zulip__postgres_password:
    environment: "ZULIP__POSTGRES_PASSWORD"
  zulip__memcached_password:
    environment: "ZULIP__MEMCACHED_PASSWORD"
  zulip__rabbitmq_password:
    environment: "ZULIP__RABBITMQ_PASSWORD"
  zulip__redis_password:
    environment: "ZULIP__REDIS_PASSWORD"
  zulip__secret_key:
    environment: "ZULIP__SECRET_KEY"
  zulip__email_password:
    environment: "ZULIP__EMAIL_PASSWORD"

services:
  traceforge-zulip-database:
    image: "docker.io/zulip/zulip-postgresql:14"
    container_name: traceforge-zulip-database
    restart: unless-stopped
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
    ports:
      - "${TRACEFORGE_ZULIP_POSTGRES_PORT:-15433}:5432"
    volumes:
      - "traceforge-zulip-postgresql-14:/var/lib/postgresql/data:rw"

  traceforge-zulip-memcached:
    image: "docker.io/library/memcached:alpine"
    container_name: traceforge-zulip-memcached
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    secrets:
      - zulip__memcached_password
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password

  traceforge-zulip-rabbitmq:
    image: "docker.io/library/rabbitmq:4.2"
    container_name: traceforge-zulip-rabbitmq
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo 'default_user = $$(RABBITMQ_DEFAULT_USER)' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $$(RABBITMQ_DEFAULT_PASS)' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - zulip__rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - "traceforge-zulip-rabbitmq:/var/lib/rabbitmq:rw"

  traceforge-zulip-redis:
    image: "docker.io/library/redis:alpine"
    container_name: traceforge-zulip-redis
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets:
      - zulip__redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - "traceforge-zulip-redis:/data:rw"

  traceforge-zulip:
    image: "ghcr.io/zulip/zulip-server:12.0-1"
    container_name: traceforge-zulip
    restart: unless-stopped
    ports:
      - "${TRACEFORGE_ZULIP_HTTP_PORT:-18080}:80"
      - "${TRACEFORGE_ZULIP_HTTPS_PORT:-18443}:443"
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
      - zulip__email_password
    environment:
      SETTING_REMOTE_POSTGRES_HOST: "traceforge-zulip-database"
      SETTING_MEMCACHED_LOCATION: "traceforge-zulip-memcached:11211"
      SETTING_RABBITMQ_HOST: "traceforge-zulip-rabbitmq"
      SETTING_REDIS_HOST: "traceforge-zulip-redis"
      SETTING_EXTERNAL_HOST: "${TRACEFORGE_ZULIP_EXTERNAL_HOST:-127.0.0.1:18443}"
      SETTING_FAKE_EMAIL_DOMAIN: "${TRACEFORGE_ZULIP_FAKE_EMAIL_DOMAIN:-traceforge.local}"
      SETTING_ZULIP_ADMINISTRATOR: "${TRACEFORGE_ZULIP_ADMIN:-traceforge-admin@example.local}"
      CERTIFICATES: "self-signed"
    volumes:
      - "traceforge-zulip-data:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - traceforge-zulip-database
      - traceforge-zulip-memcached
      - traceforge-zulip-rabbitmq
      - traceforge-zulip-redis

volumes:
  traceforge-zulip-data:
  traceforge-zulip-postgresql-14:
  traceforge-zulip-rabbitmq:
  traceforge-zulip-redis:
